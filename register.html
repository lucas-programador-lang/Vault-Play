<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Criar conta — VaultPlay</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth">
  <aside class="auth-side">
    <a class="logo" href="index.html"><i><svg viewBox="0 0 32 32" width="24" height="24" fill="none" aria-hidden="true"><path d="M11.7 14v-3.3a4.3 4.3 0 0 1 8.6 0V14" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><rect x="7.5" y="13.5" width="17" height="12.5" rx="3.8" fill="#fff"/><path class="cut" d="M14.6 17.3v5.4l4.7-2.7z" stroke-width="1.3" stroke-linejoin="round"/></svg></i>Vault<b>Play</b></a>
    <div>
      <h2>Crie sua conta e comece a anunciar.</h2>
      <p>Cada anúncio passa por uma análise rápida antes de aparecer na vitrine.</p>
    </div>
    <small>&copy; VaultPlay</small>
  </aside>
  <main class="auth-main">
    <form class="auth-box" id="register-form">
      <h1>Criar conta</h1>
      <p>Leva menos de um minuto.</p>
      <div class="field"><label for="name">Nome</label><input id="name" name="name" required autocomplete="name"></div>
      <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" required autocomplete="email"></div>
      <div class="field"><label for="pass">Senha</label><input id="pass" name="pass" type="password" required minlength="6" autocomplete="new-password"></div>
      <div class="field"><label for="pass2">Repita a senha</label><input id="pass2" name="pass2" type="password" required autocomplete="new-password"></div>
      <div class="error" id="form-error" role="alert"></div>
      <button class="btn btn-primary btn-block" type="submit">Criar conta</button>
      <p class="alt">Já tem conta? <a href="login.html">Entrar</a></p>
    </form>
  </main>
</div>
<script type="module" src="auth.js"></script>
</body>
</html>
