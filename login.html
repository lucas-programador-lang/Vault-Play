<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar — VaultPlay</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth">
  <aside class="auth-side">
    <a class="logo" href="index.html"><i><svg viewBox="0 0 32 32" width="24" height="24" fill="none" aria-hidden="true"><path d="M11.7 14v-3.3a4.3 4.3 0 0 1 8.6 0V14" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><rect x="7.5" y="13.5" width="17" height="12.5" rx="3.8" fill="#fff"/><path class="cut" d="M14.6 17.3v5.4l4.7-2.7z" stroke-width="1.3" stroke-linejoin="round"/></svg></i>Vault<b>Play</b></a>
    <div>
      <h2>Venda sua conta em poucos minutos.</h2>
      <p>Publique o anúncio, acompanhe o status no seu painel e receba o contato de quem quer comprar.</p>
    </div>
    <small>&copy; VaultPlay</small>
  </aside>
  <main class="auth-main">
    <form class="auth-box" id="login-form">
      <h1>Entrar na conta</h1>
      <p>Use seu e-mail e senha para abrir o painel.</p>
      <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" required autocomplete="email"></div>
      <div class="field"><label for="pass">Senha</label><input id="pass" name="pass" type="password" required autocomplete="current-password"></div>
      <div class="error" id="form-error" role="alert"></div>
      <button class="btn btn-primary btn-block" type="submit">Entrar</button>
      <p class="alt">Ainda não tem conta? <a href="register.html">Criar conta</a></p>
    </form>
  </main>
</div>
<script type="module" src="auth.js"></script>
</body>
</html>
