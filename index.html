<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VaultPlay — Contas de jogos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="nav">
  <div class="wrap">
    <a class="logo" href="index.html"><i>V</i>VaultPlay</a>
    <div class="nav-actions" id="nav-actions"></div>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <h1>Encontre a conta de jogo certa, direto com o vendedor.</h1>
    <p class="lead">Veja anúncios de Valorant, Free Fire, Fortnite e mais. Escolha a conta e fale com quem está vendendo.</p>
    <div class="search">
      <input id="q" type="search" placeholder="Buscar por jogo, rank ou título" aria-label="Buscar contas">
      <select id="game" aria-label="Jogo"><option value="">Todos os jogos</option></select>
      <select id="sort" aria-label="Ordenar">
        <option value="new">Mais recentes</option>
        <option value="low">Menor preço</option>
        <option value="high">Maior preço</option>
      </select>
    </div>
  </div>
</section>

<main class="wrap section">
  <div class="section-head">
    <h2>Contas à venda</h2>
    <span id="count"></span>
  </div>
  <div class="grid" id="grid"></div>
  <p style="margin-top:34px;text-align:center">
    <a class="btn btn-primary" href="dashboard.html">Anunciar minha conta</a>
  </p>
</main>

<footer class="foot"><div class="wrap">VaultPlay. Negocie com cuidado e confira a conta antes de pagar.</div></footer>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script src="script.js"></script>
</body>
</html>
